[package]
name = "sim"
version = "0.1.0"
description = "Agent-based simulation of the OIL perps market: market makers, retail traders and a keeper driving perps-core, mm-registry and orderbook in-process, with invariant checks"
edition = "2021"
publish = false

[[bin]]
name = "sim"
path = "src/main.rs"

[dependencies]
perps-core = { path = "../programs/perps-core", features = ["cpi"] }
mm-registry = { path = "../programs/mm-registry", features = ["cpi"] }
orderbook = { path = "../programs/orderbook", features = ["cpi"] }
anchor-lang = "=1.2.2"
# What the shared harness (programs/perps-core/tests/support/market_env.rs)
# needs: the same test stack as the programs' integration tests (D48)
# Agave 4.x gates the crate behind `agave-unstable-api`
solana-program-test = { version = "=4.4.1", features = ["agave-unstable-api"] }
# solana-sdk paths without solana-sdk itself: solana-sdk 5.0 breaks
# solana-runtime 4.4.1 in this graph (test-sdk/Cargo.toml says why)
solana-sdk = { package = "oil-test-sdk", path = "../test-sdk" }
# The two types chain.rs names that test-sdk does not re-export (the versions
# solana-transaction 5 and solana-banks-client 4.4 use)
solana-hash = "4"
solana-signature = "3"
# spl-token 3.5 no longer builds on these crates; same instructions and state
spl-token = { package = "spl-token-interface", version = "2" }
bincode = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# Reproducible runs and the JSON report
rand = "0.8"
serde_json = "1"

# The #[path]-included perps-core session.rs gates the localnet test schedule
# on perps-core's `localnet` feature (D46); this crate never sets it.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("localnet"))'] }
