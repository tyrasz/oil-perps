name: CI

on:
  push:
  pull_request:

jobs:
  programs:
    name: Programs (unit + end-to-end)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned: newer compilers reject code in solana-client 1.18 (never-type
      # fallback). This is the version the tests are verified with.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p perps-core -p prop-amm -p vamm

  sbf:
    name: SBF build, end-to-end on SBF, TypeScript suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Host toolchain for MSRV-aware resolution in build-sbf.sh (needs cargo >= 1.84)
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@v2
      - name: Install Solana 1.18 tools
        run: |
          curl -sSfL https://github.com/anza-xyz/agave/releases/download/v1.18.26/solana-release-x86_64-unknown-linux-gnu.tar.bz2 | tar xj -C "$HOME"
          echo "$HOME/solana-release/bin" >> "$GITHUB_PATH"
      - run: scripts/build-sbf.sh
      # Native tests can't catch SBF-only failures (e.g. the 4 KB stack limit)
      - run: SBF_OUT_DIR=$PWD/target/deploy cargo test -p perps-core -p prop-amm --test integration
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: solana-keygen new --no-bip39-passphrase --silent -o ~/.config/solana/id.json
      - run: scripts/test-ts.sh

  keeper:
    name: Keeper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned: newer compilers reject code in solana-client 1.18 (never-type
      # fallback). This is the version the tests are verified with.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend/keeper
      - run: cargo test
        working-directory: backend/keeper

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx vitest run
        working-directory: frontend

  session-vectors:
    name: Session vectors up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 scripts/gen-session-vectors.py rust | diff -u programs/perps-core/src/session_vectors.rs -
          python3 scripts/gen-session-vectors.py json | diff -u frontend/src/utils/sessionVectors.json -
