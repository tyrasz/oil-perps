name: CI

on:
  push:
  pull_request:
  # Manual runs add the live localnet smoke job (docs/localnet.md#ci)
  workflow_dispatch:

jobs:
  programs:
    name: Programs (unit + end-to-end)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Host Rust for the in-process tests: solana-program-test 4.4.1 needs
      # 1.98 (docs/lp-pool.md D48). This is the version the tests are verified with.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@v2
      # mock-pyth: the localnet-only test oracle (docs/localnet.md), never deployed
      - run: cargo test -p perps-core -p prop-amm -p vamm -p mm-registry -p orderbook -p mock-pyth
      # The localnet build's test schedule (D46): accepted only with the feature
      - run: cargo test -p perps-core --features localnet test_schedule
      # The simulation's own model and schedule against the spec and the IANA session vectors
      - run: cargo test -p sim
      # The committed IDL copies the frontend and the mm-registry SDK build
      # against match the programs (scripts/gen-idl.sh, D49)
      - run: scripts/gen-idl.sh --check

  sbf:
    name: SBF build, end-to-end on SBF, TypeScript suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Host toolchain: the SBF end-to-end tests and the simulation link
      # solana-program-test 4.4.1 (Rust 1.98); build-sbf.sh needs cargo >= 1.84
      # for MSRV-aware resolution. The SBF builds use platform-tools v1.57 (Rust 1.95).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@v2
      # Agave 4.4.1 CLI: solana-test-validator 4.4.1, cargo-build-sbf 4.5.0
      # (docs/lp-pool.md D48). The release and the platform-tools v1.57 that
      # cargo-build-sbf installs under ~/.cache/solana on first use are cached.
      - name: Cache Agave 4.4.1 and platform-tools v1.57
        uses: actions/cache@v4
        with:
          path: |
            ~/agave-v4.4.1
            ~/.cache/solana/v1.57
          key: agave-v4.4.1-platform-tools-v1.57-${{ runner.os }}
      - name: Install Agave 4.4.1 tools
        run: |
          if [ ! -x "$HOME/agave-v4.4.1/solana-release/bin/solana-test-validator" ]; then
            mkdir -p "$HOME/agave-v4.4.1"
            curl -sSfL https://github.com/anza-xyz/agave/releases/download/v4.4.1/solana-release-x86_64-unknown-linux-gnu.tar.bz2 | tar xj -C "$HOME/agave-v4.4.1"
          fi
          echo "$HOME/agave-v4.4.1/solana-release/bin" >> "$GITHUB_PATH"
      - run: solana-test-validator --version && cargo-build-sbf --version
      - run: scripts/build-sbf.sh
      # Native tests can't catch SBF-only failures (e.g. the 4 KB stack limit)
      - run: SBF_OUT_DIR=$PWD/target/deploy cargo test -p perps-core -p prop-amm -p mm-registry -p orderbook --test integration
      # Agent-based simulation (sim/) on the SBF binaries: MMs, retail, LPs and a keeper,
      # seeds 1 and 2 for two simulated days in each scenario. Fails on any invariant
      # violation or unexpected error, solvency included (fatal by default;
      # --lenient-solvency reports it instead), on a required scenario path not
      # reached, and on predicted-rejection skips past the limit (16_coverage; see
      # sim/src/checks.rs). Debug build, as the tests above.
      - name: Simulation on SBF
        run: |
          for scenario in normal stress adversarial; do
            for seed in 1 2; do
              SBF_OUT_DIR=$PWD/target/deploy cargo run -p sim -- --scenario $scenario --seed $seed --days 2 --report sim-$scenario-$seed.json
            done
          done
      # The two-day runs end before Friday's close: one run spans a weekly close and
      # its reopen, so the weekend criterion (docs/lp-pool.md §17.4) is evaluated
      # (fatal invariant 15_weekend_criterion)
      - name: Simulation across a weekend on SBF
        run: SBF_OUT_DIR=$PWD/target/deploy cargo run -p sim -- --scenario stress --seed 1 --days 5 --report sim-stress-1-weekend.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # IDLs and TS types into target/idl and target/types (D49): the harness's
      # programs are typed with them
      - run: scripts/gen-idl.sh
      # The live localnet harness (scripts/localnet, docs/localnet.md) type-checks
      # against the IDL types and the mirrors it imports from the frontend
      - run: npx tsc -p scripts/localnet/tsconfig.json
      # ... and its pure decisions (reopen print, checker coverage, gaps, bad debt, gapper sizing)
      - run: npx ts-node -P scripts/localnet/tsconfig.json --transpile-only scripts/localnet/src/selftest.ts
      - run: solana-keygen new --no-bip39-passphrase --silent -o ~/.config/solana/id.json
      - run: scripts/test-ts.sh

  # Live localnet smoke run (docs/localnet.md#ci): the localnet SBF build on
  # solana-test-validator with the keeper binary, bots and the invariant checker
  # for DURATION_SECS of wall clock; fails on any checker violation. Manual only:
  # it costs 15-30 min (keeper build, up to 12 min of setup waiting for the LP
  # deposit window when it starts in a test weekend) and what it covers depends
  # on where in the hour it starts.
  localnet-smoke:
    name: Localnet smoke (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            backend/keeper
      # Agave 4.4.1 CLI: solana-test-validator 4.4.1, cargo-build-sbf 4.5.0
      # (docs/lp-pool.md D48). The release and the platform-tools v1.57 that
      # cargo-build-sbf installs under ~/.cache/solana on first use are cached.
      - name: Cache Agave 4.4.1 and platform-tools v1.57
        uses: actions/cache@v4
        with:
          path: |
            ~/agave-v4.4.1
            ~/.cache/solana/v1.57
          key: agave-v4.4.1-platform-tools-v1.57-${{ runner.os }}
      - name: Install Agave 4.4.1 tools
        run: |
          if [ ! -x "$HOME/agave-v4.4.1/solana-release/bin/solana-test-validator" ]; then
            mkdir -p "$HOME/agave-v4.4.1"
            curl -sSfL https://github.com/anza-xyz/agave/releases/download/v4.4.1/solana-release-x86_64-unknown-linux-gnu.tar.bz2 | tar xj -C "$HOME/agave-v4.4.1"
          fi
          echo "$HOME/agave-v4.4.1/solana-release/bin" >> "$GITHUB_PATH"
      - run: solana-test-validator --version && cargo-build-sbf --version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: solana-keygen new --no-bip39-passphrase --silent -o ~/.config/solana/id.json
      - run: DURATION_SECS=300 REPORT_DIR=$PWD/localnet-report scripts/localnet/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: localnet-report
          path: localnet-report

  keeper:
    name: Keeper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The same host Rust as the programs (the keeper is on the Anchor 1.2.2 /
      # solana-v3 client crates, D48)
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend/keeper
      - run: cargo test
        working-directory: backend/keeper

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx vitest run
        working-directory: frontend
      # Builds against the committed IDL copy in frontend/src/idl (D49)
      - run: npm run build
        working-directory: frontend

  session-vectors:
    name: Session vectors up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 scripts/gen-session-vectors.py rust | diff -u programs/perps-core/src/session_vectors.rs -
          python3 scripts/gen-session-vectors.py json | diff -u frontend/src/utils/sessionVectors.json -
