name: CI

on:
  push:
  pull_request:

jobs:
  programs:
    name: Programs (unit + end-to-end)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p perps-core -p prop-amm -p vamm

  keeper:
    name: Keeper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend/keeper
      - run: cargo test
        working-directory: backend/keeper

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx vitest run
        working-directory: frontend

  session-vectors:
    name: Session vectors up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 scripts/gen-session-vectors.py rust | diff -u programs/perps-core/src/session_vectors.rs -
          python3 scripts/gen-session-vectors.py json | diff -u frontend/src/utils/sessionVectors.json -
