[features]
# Anchor 0.30 renamed `seeds` to `resolution`; false keeps the IDL free of
# account resolution, as `seeds = false` did
resolution = false

[programs.localnet]
perps_core = "Fg6PaFpoGXkYsidMpWTK6W2BeZ7FEfcYkg476zPFsLnS"
orderbook = "2XhUqeGhdkhKdZXkjHmMmFMXBJfYVVCbFxKjKqkCdMzt"
vamm = "3Vft6oJxPvHXELuqrPgCdPqJf1LxGpqDxBdqNhJxLZbm"
prop_amm = "PropAMM111111111111111111111111111111111111"
mm_registry = "MMReg11111111111111111111111111111111111111"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[test]
# Deploy workspace programs through the upgradeable loader with the provider
# wallet as upgrade authority, so tests can run initialize_config.
upgradeable = true
