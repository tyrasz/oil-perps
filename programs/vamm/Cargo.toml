[package]
name = "vamm"
version = "0.1.0"
description = "Virtual AMM backstop for liquidity provision"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "vamm"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "perps-core/idl-build"]
# Declared so Anchor's macros' cfg checks don't warn (unexpected_cfgs)
anchor-debug = []
custom-heap = []
custom-panic = []

# The program macros test `target_os = "solana"`, which the host rustc doesn't list
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[profile.release]
overflow-checks = true

[dependencies]
anchor-lang = "=1.2.2"
perps-core = { path = "../perps-core", features = ["cpi"] }

[dev-dependencies]
# In-process end-to-end tests, with perps-core loaded alongside
# Agave 4.x gates the crate behind `agave-unstable-api`
solana-program-test = { version = "=4.4.1", features = ["agave-unstable-api"] }
# solana-sdk paths without solana-sdk itself (test-sdk/Cargo.toml says why)
solana-sdk = { package = "oil-test-sdk", path = "../../test-sdk" }
# spl-token 3.5 no longer builds on these crates; same instructions and state
spl-token = { package = "spl-token-interface", version = "2" }
bytemuck = "1"
bincode = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
