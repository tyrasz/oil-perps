[package]
name = "orderbook"
version = "0.1.0"
description = "On-chain order book for perpetual futures"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "orderbook"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[profile.release]
overflow-checks = true

[dependencies]
anchor-lang = "0.28.0"
perps-core = { path = "../perps-core", features = ["cpi"] }

[dev-dependencies]
# In-process end-to-end tests, with perps-core loaded alongside
solana-program-test = "~1.16"
solana-sdk = "~1.16"
spl-token = { version = "3.5", features = ["no-entrypoint"] }
pyth-sdk-solana = "0.8"
bytemuck = "1"
bincode = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
