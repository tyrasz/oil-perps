[package]
name = "perps-core"
version = "0.1.0"
description = "Core perpetual futures trading engine"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "perps_core"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[profile.release]
overflow-checks = true

[dependencies]
anchor-lang = "0.28.0"
anchor-spl = "0.28.0"
pyth-sdk-solana = "0.8"

[dev-dependencies]
# Runs the program natively in-process for integration tests (no SBF build or validator)
solana-program-test = "~1.16"
solana-sdk = "~1.16"
spl-token = { version = "3.5", features = ["no-entrypoint"] }
bytemuck = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
bincode = "1"
