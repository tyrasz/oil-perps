[package]
name = "oil-test-sdk"
version = "0.1.0"
description = "TEST ONLY: the slice of the solana-sdk API the programs' integration tests use, re-exported from the component crates solana-program-test 4.4 is built on"
edition = "2021"
publish = false

# Why not solana-sdk itself: solana-sdk 5.0 turns on solana-account's
# `bincode` feature, whose inherent `AccountSharedData::new_data` then shadows
# the wincode trait method solana-runtime 4.4.1 calls, and solana-runtime no
# longer compiles (docs/lp-pool.md D48). The tests depend on this crate under
# the name `solana-sdk`, so their `solana_sdk::...` paths are unchanged.

[dependencies]
solana-account = "5.0.0"
solana-account-info = "3.2"
solana-clock = "4.0.0"
solana-compute-budget-interface = "3.1.0"
solana-instruction = "4.0.0"
solana-instruction-error = "3"
solana-keypair = "4.0.0"
solana-loader-v3-interface = { version = "9.0.0", features = ["serde"] }
solana-program = "=6.0.0"
solana-program-error = "3"
solana-program-pack = "3.1.0"
solana-pubkey = "4.4"
solana-sdk-ids = "3.1.0"
solana-signer = "4.0.0"
solana-system-interface = { version = "3.3.0", features = ["bincode"] }
solana-sysvar = "5.0.0"
# The programs' cohort (Anchor 1.2 solana-v3): native_stubs.rs forwards its stubs
solana-sysvar-v3 = { package = "solana-sysvar", version = "3.1" }
solana-transaction = "5.0.0"
solana-transaction-error = "4.0.0"
