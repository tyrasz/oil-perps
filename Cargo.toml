[workspace]
resolver = "2"
members = [
    "programs/*",
    # Agent-based simulation driving the programs in-process (test tooling)
    "sim"
]
# Backend is excluded due to dependency conflicts with Solana versions
# Build backend separately with: cargo build -p oil-perps-api
exclude = [
    "backend/api",
    "backend/indexer",
    "backend/keeper"
]

[workspace.dependencies]
anchor-lang = "0.28.0"
anchor-spl = "0.28.0"
solana-program = "1.16"
pyth-sdk-solana = "0.8"

[profile.release]
# Fail loudly instead of silently wrapping on arithmetic overflow
overflow-checks = true
